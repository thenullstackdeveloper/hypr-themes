# ============================================================
#  hyprlock - lock screen
# ============================================================
# This file is YOURS — hypr-themes never overwrites it. The colors come from
# hyprlock-theme.conf (regenerated by `theme <name>`), pulled in below.
# Layout, fonts and sizes here are yours to edit.

source = ~/.config/hypr/hyprlock-theme.conf

background {
    monitor =
    color = $lock_bg
}

# Big clock
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $lock_text
    font_size = 90
    font_family = sans-serif
    position = 0, 200
    halign = center
    valign = center
}

# Date under the clock
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $lock_text_dim
    font_size = 24
    font_family = sans-serif
    position = 0, 120
    halign = center
    valign = center
}

# Centered password field
input-field {
    monitor =
    size = 320, 60
    position = 0, -80
    halign = center
    valign = center

    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.3

    outer_color = $lock_accent
    inner_color = $lock_inner
    font_color  = $lock_text

    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    fail_color = $lock_fail
}
